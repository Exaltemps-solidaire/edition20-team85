name: team85
networks:
  core-network:
    external: true
services:
  frontend:
    image: localhost:5000/team85/frontend:dev
    networks: [core-network]
    ports: ["8080:80"]
  api:
    image: localhost:5000/team85/api:dev
    networks: [core-network]
    ports: ["8081:8081"]
    environment:
      PORT: "8081"
