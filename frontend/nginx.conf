# Repris du gabarit de la plateforme (core-platform/templates/nginx.conf), adapté :
# connect-src réduit à 'self' (pas de localhost:8501/9000, injoignables depuis le navigateur du
# visiteur — voir le CLAUDE.md racine), et les routes /health, /sante conservées pour le contrat
# de déployabilité.
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

  location ~ ^/(health|sante)$ {
    default_type text/plain;
  }

  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location / { try_files $uri $uri.html $uri/ /index.html; }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
